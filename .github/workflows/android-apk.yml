name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Dr.Doc-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Replace the "latest" release so the APK always lives at a fixed, public download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/Dr.Doc.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dr.Doc.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dr.Doc.apk \
            --target "$GITHUB_SHA" \
            --title "Dr.Doc – latest build" \
            --notes "Built from commit $GITHUB_SHA. Download Dr.Doc.apk below, open it on your Android phone and allow 'Install unknown apps' when asked."
